databases:
  - name: brujula-db
    plan: free
    region: virginia
    databaseName: brujula
    user: brujula
    postgresMajorVersion: "16"

services:
  - type: web
    name: brujula-api
    runtime: docker
    region: virginia
    plan: free
    repo: https://github.com/gjcardonam/brujula-api
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/salud
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: brujula-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: brujula-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: brujula-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: brujula-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: brujula-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://brujula-web.onrender.com
      - key: MODO_DESARROLLO
        value: "false"
      - key: GOOGLE_CLIENT_ID
        value: 235983747732-j90s1elc7r7h5dc85b8v2b50p6c3o2qh.apps.googleusercontent.com
      - key: DATOS_EJEMPLO
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@brujula.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: brujula-web
    runtime: static
    repo: https://github.com/gjcardonam/brujula-web
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://brujula-api.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        value: 235983747732-j90s1elc7r7h5dc85b8v2b50p6c3o2qh.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
