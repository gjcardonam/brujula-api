spring:
  application:
    name: brujula-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:brujula}}
    username: ${DB_USER:brujula}
    password: ${DB_PASSWORD:brujula}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: always

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

brujula:
  jwt-secret: ${JWT_SECRET:brujula-desarrollo-cambia-este-secreto-2026-udea}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  modo-desarrollo: ${MODO_DESARROLLO:true}
  uploads-dir: ${UPLOADS_DIR:./uploads}
  mail-from: ${MAIL_FROM:no-reply@brujula.local}
  brevo-api-key: ${BREVO_API_KEY:}
  admin:
    email: ${ADMIN_EMAIL:admin@brujula.local}
    password: ${ADMIN_PASSWORD:Admin.2026}
  datos-ejemplo: ${DATOS_EJEMPLO:true}

logging:
  level:
    co.edu.udea.brujula: INFO
